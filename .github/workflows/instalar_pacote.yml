name: Instalar pacote (zip enviado)
on:
  workflow_dispatch:
    inputs:
      msg:
        description: "Mensagem do commit"
        required: false
        default: "feat: pacote de atualizacao"
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar, conferir e commitar
        run: |
          test -f pacote.zip
          unzip -o pacote.zip
          rm -f pacote.zip
          python3 -m py_compile *.py
          git config user.name "setup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "${{ github.event.inputs.msg }}"
          for i in 1 2 3; do git push && break; git pull --rebase origin main; done
