name: Publicar proximo video (Nao Faca Isso)

on:
  schedule:
    - cron: "7 12-23,0-2 * * *"   # de hora em hora, 09h-23h (Brasilia); meta_dia.py decide se publica
    - cron: "37 12-23,0-2 * * *"   # segundo disparo por hora (o GitHub atrasa/pula agendados); casa com a antecedencia de 45 min da agenda
  workflow_dispatch:
    inputs:
      id:
        description: "ID do roteiro (opcional; vazio = o proximo da fila)"
        required: false
        default: ""
      so_instagram:
        description: "true = postar SO no Instagram (video ja publicado no YouTube)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: zerogravidade-publicar
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Decidir se este horario publica (meta de 4 Shorts por dia)
        id: d
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python3 meta_dia.py; else echo "publicar=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.d.outputs.publicar == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Garantir ffmpeg (a imagem do runner pode nao trazer)
        if: steps.d.outputs.publicar == 'true'
        run: |
          which ffmpeg >/dev/null 2>&1 || (sudo apt-get update -y -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -1

      - run: pip install -r requirements.txt
        if: steps.d.outputs.publicar == 'true'
      - name: Motor 3D (Chromium headless + three.js)
        if: steps.d.outputs.publicar == 'true'
        run: |
          python -m playwright install --with-deps chromium
          (cd pov3d && npm install three@0.160.0 --no-audit --no-fund)

      - name: Escrever roteiro novo se a fila estiver curta
        if: steps.d.outputs.publicar == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python roteirista.py --se-fila-curta || true

      - name: Renderizar e publicar
        if: steps.d.outputs.publicar == 'true'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS=""; fi
          if [ -n "${{ github.event.inputs.id }}" ]; then ARGS="--id ${{ github.event.inputs.id }}"; fi
          if [ "${{ github.event.inputs.so_instagram }}" = "true" ]; then ARGS="$ARGS --so-instagram"; fi
          set +e
          python publish.py $ARGS
          COD=$?
          rm -f token.json
          git config user.name "zerogravidade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f state/*.json conteudo/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: estado da publicacao"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase --autostash origin main
            sleep 5
          done
          exit $COD

      - name: Previa (quadros do video) como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore
