name: Instalar codigo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar o pacote e commitar
        run: |
          unzip -o canal_code.zip
          rm -f canal_code.zip
          git config user.name "setup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: codigo inicial do canal"
          git push
