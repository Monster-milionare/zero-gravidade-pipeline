name: Placar de metricas

on:
  schedule:
    - cron: "7 1 * * *"    # ~22:07 Brasilia: atualiza os pesos antes do lote de amanha
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zerogravidade-metricas
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  placar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Calcular placar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json; fi
          python metricas.py || true
          python supervisor.py || true
          rm -f token.json
          git config user.name "zerogravidade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f state/pesos.json state/placar.md state/views.json state/supervisor.md state/foco.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: placar de metricas"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase --autostash origin main
            sleep 5
          done
