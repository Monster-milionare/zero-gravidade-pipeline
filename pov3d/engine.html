<script>

// ---------------------------------------------------------------- hora do dia (ceu coerente com a fala)
const INTERIORES = new Set(['cabine', 'laboratorio', 'palacio', 'lua']);
const HORAS = {
  dia:       {ceu: [0x2f6fd0, 0x78b4ee, 0xe4f2ff], fundo: 0x9fd0ff, nevoa: 0xcfe6ff, hemi: [0xbfd8ff, 0x7a6a50, 1.0], dir: [0xfff2d8, 1.15, [-8, 16, 10]], estrelas: false, ponto: 0.12},
  manha:     {ceu: [0x4a8ad8, 0x9cc8f0, 0xfff0d0], fundo: 0xbcdcf6, nevoa: 0xeee8da, hemi: [0xd8e6ff, 0x8a7a60, 1.0], dir: [0xffe4b8, 1.1, [-15, 9, 10]], estrelas: false, ponto: 0.1},
  amanhecer: {ceu: [0x3a5a9a, 0xe09a7a, 0xffd8a0], fundo: 0xe8a888, nevoa: 0xf0c0a0, hemi: [0xffd0b0, 0x5a4a40, 0.95], dir: [0xffb878, 1.0, [-17, 5, 10]], estrelas: false, ponto: 0.25},
  tarde:     {ceu: [0x3a78c8, 0xf0b080, 0xffd890], fundo: 0xf0c890, nevoa: 0xf2d6a8, hemi: [0xffe0b0, 0x6a5a40, 1.0], dir: [0xffc080, 1.05, [-13, 8, 11]], estrelas: false, ponto: 0.15},
  entardecer: {ceu: [0x1f2f7a, 0xd9764a, 0xffd28a], fundo: 0xd9764a, nevoa: 0xe8b080, hemi: [0xffd0a0, 0x4a4a40, 0.95], dir: [0xffa060, 1.0, [-16, 5, 12]], estrelas: false, ponto: 0.5},
  noite:     {ceu: [0x070b24, 0x1a2a5a, 0x3a3a6a], fundo: 0x10163a, nevoa: 0x1a2250, hemi: [0x7f94e8, 0x3a2e24, 1.25], dir: [0x9bb0ff, 0.7, [-6, 12, 8]], estrelas: true, ponto: 1},
  madrugada: {ceu: [0x03051a, 0x0e1840, 0x24285a], fundo: 0x0a1030, nevoa: 0x121a44, hemi: [0x6a7fd0, 0x2a2430, 1.1], dir: [0x8aa0f0, 0.55, [-6, 12, 8]], estrelas: true, ponto: 1},
};
function aplicarHora(a, hora) {
  const h = hora || 'orig';
  if (a.hora === h) return;
  a.hora = h;
  if (INTERIORES.has(a.nome)) return;
  let P;
  if (h === 'orig' || !HORAS[h]) {
    const c = a.cfg;
    P = {ceu: c.ceu, fundo: c.fundo, nevoa: c.nevoa[0], hemi: [c.hemiCeu, c.hemiChao, c.hemiInt], dir: [c.dirCor, c.dirInt, c.dirPos], estrelas: !c.semEstrelas, ponto: 1};
  } else P = HORAS[h];
  const U = a.dome.material.uniforms;
  U.topo.value.set(P.ceu[0]); U.meio.value.set(P.ceu[1]); U.hor.value.set(P.ceu[2]);
  a.fundoAtual = P.fundo; a.nevoaCor = P.nevoa;
  a.hemi.color.set(P.hemi[0]); a.hemi.groundColor.set(P.hemi[1]); a.hemi.intensity = P.hemi[2];
  a.dir.color.set(P.dir[0]); a.dir.intensity = P.dir[1]; a.dir.position.set(...P.dir[2]);
  a.estrelas.visible = P.estrelas;
  a.pontoMult = P.ponto;
  const noite = (h === 'orig') || h === 'noite' || h === 'madrugada';
  const fb = h === 'entardecer' ? 0.7 : h === 'amanhecer' ? 0.45 : 0.12;
  a.g.traverse(o => { if (o.isSprite && o.material.blending === THREE.AdditiveBlending) { if (o.userData.op0 === undefined) o.userData.op0 = o.material.opacity; o.material.opacity = o.userData.op0 * (noite ? 1 : fb); } });
  if (a.mar) { const c = a.marCor.clone(); if (h === 'orig' || h === 'noite' || h === 'madrugada') { if (h === 'madrugada') c.multiplyScalar(0.7); } else c.lerp(new THREE.Color(0x4a8ac8), 0.55).multiplyScalar(h === 'entardecer' ? 1.0 : 1.5); a.mar.material.color.copy(c); }
  if (ativo === a.nome) { scene.background = new THREE.Color(P.fundo); scene.fog.color.set(P.nevoa); }
}

// ---------------------------------------------------------------- loop de quadro
let shots = [], ativo = null;
window.setShots = s => { shots = s; };
function entrar(nome) {
  for (const k in amb) amb[k].g.visible = (k === nome);
  const A = amb[nome], c = A.cfg; ativo = nome;
  scene.background = new THREE.Color(A.fundoAtual !== undefined ? A.fundoAtual : c.fundo);
  scene.fog = new THREE.Fog(A.nevoaCor !== undefined ? A.nevoaCor : c.nevoa[0], c.nevoa[1], c.nevoa[2]);
}
window.frame = function (t, amp, fmt) {
  let s = shots[shots.length - 1];
  for (const x of shots) if (t >= x.t0 && t < x.t1) { s = x; break; }

  for (const f of a.anim) f(t);
  a.ponto.intensity *= a.pontoMult;

  maosG.visible = !!pose;
  if (pose) {
    maosG.position.copy(cam.position); maosG.quaternion.copy(cam.quaternion);
    const bob = Math.sin(t * 3.3) * 0.012;
    mE.position.set(pose.e[0], pose.e[1] + bob, pose.e[2]); mE.rotation.set(0, pose.e[3], 0);
    mD.position.set(pose.d[0], pose.d[1] + bob, pose.d[2]); mD.rotation.set(0, pose.d[3], 0);
    for (const l of [-1, 1]) luvas[l].dedos.forEach((d, i) => { d.rotation.x = -pose.curl * (0.85 + i * 0.05) + Math.sin(t * 2 + i) * 0.03; });
    for (const p of [propLuneta, propLanterna, propBussola]) p.visible = false;
    if (pose.prop) { const p = pose.prop[0]; p.visible = true; p.position.set(pose.prop[1], pose.prop[2] + bob, pose.prop[3]); }
    agulha.rotation.y = Math.sin(t * 6.5) * 2.4 + t * 2.2;          // agulha da bussola enlouquecida
    propLanterna.rotation.z = Math.sin(t * 2.4) * 0.05;
  }
  for (const c of a.chars) {
    const d = c.userData, fala = (s.falante === d.id) || (d.prot && s.falante === 'prot');
    c.visible = d.prot ? ext : true;
    const bob = Math.sin(t * 2.2 + d.fase);
    c.position.y = d.base + (fala ? Math.abs(Math.sin(t * 6 + d.fase)) * 0.03 : 0);
    c.rotation.z = Math.sin(t * 1.7 + d.fase) * 0.025;
    d.cab.rotation.x = fala ? -0.06 + Math.sin(t * 5) * 0.03 : 0.04 + bob * 0.02;
    d.cab.rotation.y = fala ? Math.sin(t * 2.4 + d.fase) * 0.1 : Math.sin(t * 0.9 + d.fase) * 0.18;
    const abre = fala ? Math.min(1, amp * 1.25) : 0.0;
    d.boca.scale.set(1.2 - abre * 0.35, 0.2 + abre * 1.0, 0.5);
    const piscar = (Math.sin(t * 1.3 + d.fase * 3) > 0.985) ? 0.1 : 1;
    for (const e of d.olhos) e.scale.y = piscar;
    d.bracos[0].rotation.z = 0.25 + (fala ? Math.sin(t * 4.5) * 0.35 + 0.2 : bob * 0.05);
    d.bracos[1].rotation.z = -0.25 - (fala ? Math.sin(t * 4.0 + 1) * 0.3 + 0.2 : bob * 0.05);
  }
  window.posRender(t);
  return fmt === 'png' ? renderer.domElement.toDataURL('image/png') : renderer.domElement.toDataURL('image/jpeg', 0.93);
};
window.ambientes = () => Object.fromEntries(Object.entries(amb).map(([k, v]) => [k, Object.keys(v.cams)]));
</script>
