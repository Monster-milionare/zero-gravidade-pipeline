<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
// Motor 2D ilustrado (camadas com parallax + personagens vetoriais). Mesma API do motor 3D:
// window.setElenco(spec), window.setShots(shots), window.frame(t, amp[, fmt]) -> dataURL.
const W = window.__W || 1080, H = window.__H || 1920;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');

// ---------------------------------------------------------------- utilidades
let _s = 987654;
const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u * u * (3 - 2 * u);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function off(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return [c, c.getContext('2d')]; }
function lg(c, x0, y0, x1, y1, stops) { const r = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => r.addColorStop(o, col)); return r; }
function rg(c, x, y, r0, r1, stops) { const r = c.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, col]) => r.addColorStop(o, col)); return r; }
function hex(c, a) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function mix(c1, c2, u) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16); const m = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, u)); return '#' + ((1 << 24) | (m(16) << 16) | (m(8) << 8) | m(0)).toString(16).slice(1); }
function glow(c, x, y, r, col, a) { c.fillStyle = rg(c, x, y, 0, r, [[0, hex(col, a)], [1, hex(col, 0)]]); c.fillRect(x - r, y - r, r * 2, r * 2); }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function capsule(c, x0, y0, x1, y1, w) { c.lineCap = 'round'; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); }
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); }

// ---------------------------------------------------------------- personagens (frente, estilo "boneco" fofo)
const ROLES = {};   // preenchido pelos arquivos de cenario/papeis
function papel2d(nome) { if (!ROLES[nome]) throw new Error('papel 2D inexistente: ' + nome); return Object.assign({}, ROLES[nome]); }

function olhos(c, o, ox, oy, abre, piscar, olhaX) {
  for (const s of [-1, 1]) {
    const ex = ox + 44 * s, ey = oy;
    c.fillStyle = '#fff'; ell(c, ex, ey, 27, 31 * piscar); c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 3; c.stroke();
    if (piscar > 0.4) {
      c.fillStyle = o.iris || '#4a2a14'; ell(c, ex + olhaX * 8, ey + 2, 15, 17 * piscar); c.fill();
      c.fillStyle = '#0a0606'; ell(c, ex + olhaX * 8, ey + 3, 8, 9 * piscar); c.fill();
      c.fillStyle = '#fff'; ell(c, ex + olhaX * 8 + 5, ey - 5, 5, 5); c.fill();
    }
  }
}

function humano(c, o, x, y, s, t, falando, amp, olhaX) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const bob = Math.sin(t * 2.2 + (o.fase || 0)) * 3, gest = falando ? Math.sin(t * 5) : 0;
  // sombra
  c.fillStyle = 'rgba(0,0,0,0.28)'; ell(c, 0, 6, 120, 22); c.fill();
  c.translate(0, bob * 0.4);
  const pant = o.calca || '#3a4a6a', top = o.camisa || '#d8c8a0', vest = o.colete, skin = o.pele || '#f0c49a', skin2 = mix(skin, '#8a4a2a', 0.22);
  // mochila (atras)
  if (o.mochila) { c.fillStyle = o.mochila; rrect(c, -86, -330, 172, 190, 34); c.fill(); c.fillStyle = 'rgba(0,0,0,0.18)'; rrect(c, -86, -250, 172, 20, 8); c.fill(); }
  // rabo de cavalo atras
  if (o.cabelo && o.penteado === 'rabo') { c.fillStyle = o.cabelo; ell(c, 92, -440, 34, 58, 0.5); c.fill(); }
  // pernas
  for (const sx of [-1, 1]) { c.strokeStyle = pant; capsule(c, 30 * sx, -150, 34 * sx, -26, 50); c.fillStyle = o.bota || '#3a2a1a'; ell(c, 36 * sx, -12, 38, 20); c.fill(); }
  // tronco
  c.fillStyle = lg(c, -80, -330, 80, -140, [[0, mix(top, '#ffffff', 0.18)], [1, mix(top, '#000000', 0.18)]]);
  c.beginPath(); c.moveTo(-76, -325); c.quadraticCurveTo(0, -352, 76, -325); c.lineTo(66, -138); c.quadraticCurveTo(0, -122, -66, -138); c.closePath(); c.fill();
  if (o.listras) { c.fillStyle = o.listras; for (let i = 0; i < 5; i++) c.fillRect(-72, -310 + i * 36, 144, 12); }
  if (vest) { c.fillStyle = vest; c.beginPath(); c.moveTo(-76, -325); c.lineTo(-24, -330); c.lineTo(-14, -138); c.lineTo(-66, -138); c.closePath(); c.fill(); c.beginPath(); c.moveTo(76, -325); c.lineTo(24, -330); c.lineTo(14, -138); c.lineTo(66, -138); c.closePath(); c.fill();
    c.fillStyle = 'rgba(0,0,0,0.16)'; rrect(c, -62, -250, 40, 44, 6); c.fill(); rrect(c, 22, -250, 40, 44, 6); c.fill(); }
  c.fillStyle = o.cinto || '#4a3220'; c.fillRect(-68, -150, 136, 14);
  if (o.binoculos) { c.strokeStyle = '#2a2a30'; c.lineWidth = 5; c.beginPath(); c.moveTo(-34, -330); c.quadraticCurveTo(0, -240, 34, -330); c.stroke(); c.fillStyle = '#2a2a34'; rrect(c, -34, -262, 26, 40, 8); c.fill(); rrect(c, 8, -262, 26, 40, 8); c.fill(); c.fillStyle = '#5a8ad0'; ell(c, -21, -222, 9, 6); c.fill(); ell(c, 21, -222, 9, 6); c.fill(); }
  if (o.gravata) { c.fillStyle = o.gravata; c.beginPath(); c.moveTo(-10, -332); c.lineTo(10, -332); c.lineTo(15, -300); c.lineTo(0, -214); c.lineTo(-15, -300); c.closePath(); c.fill(); }
  if (o.emblema) { c.fillStyle = o.emblema; ell(c, -40, -262, 17, 17); c.fill(); c.fillStyle = 'rgba(255,255,255,0.85)'; ell(c, -40, -262, 9, 9); c.fill(); }
  if (o.lenco) { c.fillStyle = o.lenco; c.beginPath(); c.moveTo(-44, -332); c.quadraticCurveTo(0, -300, 44, -332); c.lineTo(0, -270); c.closePath(); c.fill(); }
  if (o.jaleco) { c.fillStyle = 'rgba(255,255,255,0.0)'; }
  // bracos
  const a0 = 0.22 + (falando ? 0.12 + gest * 0.2 : Math.sin(t * 1.6) * 0.02), a1 = -0.22 - (falando ? 0.3 + gest * 0.25 : Math.sin(t * 1.6 + 1) * 0.02);
  [-1, 1].forEach(sx => {
    c.save(); c.translate(80 * sx, -308); c.rotate(sx < 0 ? a0 : a1);
    c.strokeStyle = o.manga || top; capsule(c, 0, 0, 0, 122, 40);
    c.fillStyle = skin; ell(c, 0, 138, 21, 21); c.fill();
    c.restore();
  });
  // pescoco + cabeca
  c.fillStyle = skin2; rrect(c, -22, -352, 44, 34, 10); c.fill();
  const hy = -450;
  c.save(); c.translate(0, hy); c.rotate((falando ? Math.sin(t * 2.4) * 0.05 : Math.sin(t * 0.9 + (o.fase || 0)) * 0.03));
  // orelhas
  c.fillStyle = skin; ell(c, -112, 8, 16, 22); c.fill(); ell(c, 112, 8, 16, 22); c.fill();
  c.fillStyle = lg(c, -110, -110, 90, 120, [[0, mix(skin, '#ffffff', 0.25)], [1, skin2]]); ell(c, 0, 0, 114, 112); c.fill();
  // cabelo
  if (o.cabelo && o.penteado !== 'careca') {
    c.fillStyle = o.cabelo;
    if (o.penteado === 'mop') { c.beginPath(); c.moveTo(-116, 10); c.quadraticCurveTo(-130, -100, -20, -118); c.quadraticCurveTo(80, -130, 116, 0); c.quadraticCurveTo(120, -50, 70, -70); c.quadraticCurveTo(0, -30, -70, -70); c.closePath(); c.fill(); }
    else { c.beginPath(); c.moveTo(-114, 6); c.quadraticCurveTo(-128, -112, 0, -118); c.quadraticCurveTo(128, -112, 114, 6); c.quadraticCurveTo(100, -52, 0, -62); c.quadraticCurveTo(-100, -52, -114, 6); c.closePath(); c.fill(); }
  }
  // rosto
  const pisc = (Math.sin(t * 1.3 + (o.fase || 0) * 3) > 0.985) ? 0.12 : 1;
  olhos(c, o, 0, -4, 1, pisc, olhaX);
  c.strokeStyle = o.cabelo || '#2a1a10'; c.lineWidth = 8; c.lineCap = 'round';
  for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(44 * sx - 24, -42 + (falando ? -4 : 0)); c.lineTo(44 * sx + 24, -50 - sx * (falando ? 4 : 0) + (falando ? -3 : 0)); c.stroke(); }
  c.fillStyle = hex('#e87a6a', 0.45); ell(c, -74, 40, 20, 13); c.fill(); ell(c, 74, 40, 20, 13); c.fill();
  c.fillStyle = skin2; ell(c, 0, 26, 12, 10); c.fill();
  if (o.oculos) { c.strokeStyle = o.oculos; c.lineWidth = 6; ell(c, -44, -4, 36, 36); c.stroke(); ell(c, 44, -4, 36, 36); c.stroke(); c.beginPath(); c.moveTo(-8, -6); c.lineTo(8, -6); c.stroke(); c.fillStyle = 'rgba(180,220,255,0.18)'; ell(c, -44, -4, 34, 34); c.fill(); ell(c, 44, -4, 34, 34); c.fill(); }
  if (o.barba) { c.fillStyle = o.barba; c.beginPath(); c.moveTo(-92, 24); c.quadraticCurveTo(-96, 130, 0, 138); c.quadraticCurveTo(96, 130, 92, 24); c.quadraticCurveTo(60, 70, 0, 66); c.quadraticCurveTo(-60, 70, -92, 24); c.closePath(); c.fill(); }
  // boca
  const ab = falando ? clamp(amp * 1.3, 0.12, 1) : 0.0;
  if (ab > 0.08) { c.fillStyle = '#4a1410'; ell(c, 0, 64 + ab * 6, 20 - ab * 3, 6 + ab * 24); c.fill(); c.fillStyle = '#e8706a'; ell(c, 0, 64 + ab * 16, 12, 4 + ab * 9); c.fill(); }
  else { c.strokeStyle = '#6a2a20'; c.lineWidth = 6; c.beginPath(); c.arc(0, 52, 18, 0.25, Math.PI - 0.25); c.stroke(); }
  if (o.bigode) { c.fillStyle = o.bigode; c.beginPath(); c.moveTo(-40, 46); c.quadraticCurveTo(0, 30, 40, 46); c.quadraticCurveTo(0, 58, -40, 46); c.fill(); }
  // headset (controlador)
  if (o.headset) { c.strokeStyle = '#1a1a20'; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.arc(0, -8, 120, Math.PI * 1.08, Math.PI * 1.92); c.stroke(); c.fillStyle = '#26262e'; ell(c, -118, 10, 20, 30); c.fill(); ell(c, 118, 10, 20, 30); c.fill(); c.strokeStyle = '#1a1a20'; c.lineWidth = 7; c.beginPath(); c.moveTo(-118, 36); c.quadraticCurveTo(-96, 90, -40, 78); c.stroke(); c.fillStyle = '#1a1a20'; ell(c, -36, 78, 12, 9); c.fill(); }
  // capacete de astronauta (bolha de vidro + argola)
  if (o.capacete) { c.fillStyle = 'rgba(190,225,255,0.20)'; ell(c, 0, -2, 150, 148); c.fill(); c.strokeStyle = 'rgba(255,255,255,0.65)'; c.lineWidth = 7; ell(c, 0, -2, 150, 148); c.stroke(); c.fillStyle = 'rgba(255,255,255,0.45)'; ell(c, -66, -70, 30, 14, -0.7); c.fill(); c.fillStyle = o.argola || '#d8dde6'; rrect(c, -104, 118, 208, 34, 14); c.fill(); c.fillStyle = 'rgba(0,0,0,0.18)'; rrect(c, -104, 140, 208, 12, 6); c.fill(); }
  // chapeus
  if (o.chapeu === 'safari') { c.fillStyle = o.corChapeu || '#c9b27a'; ell(c, 0, -68, 150, 34); c.fill(); c.fillStyle = mix(o.corChapeu || '#c9b27a', '#ffffff', 0.12); c.beginPath(); c.moveTo(-84, -70); c.quadraticCurveTo(-88, -168, 0, -170); c.quadraticCurveTo(88, -168, 84, -70); c.closePath(); c.fill(); c.fillStyle = o.faixa || '#6a4a2a'; c.fillRect(-84, -96, 168, 20); }
  if (o.chapeu === 'bone') { c.fillStyle = o.corChapeu || '#c8281e'; c.beginPath(); c.moveTo(-108, -30); c.quadraticCurveTo(-110, -148, 0, -150); c.quadraticCurveTo(110, -148, 108, -30); c.closePath(); c.fill(); c.fillRect(-20, -60, 190, 20); }
  c.restore();
  c.restore();
}

// ---------------------------------------------------------------- filhote de tricerátopo (frente)
function tricera(c, o, x, y, s, t, falando, amp) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const bob = Math.sin(t * 2.6 + 1) * 4;
  c.fillStyle = 'rgba(0,0,0,0.28)'; ell(c, 0, 6, 150, 24); c.fill();
  c.translate(0, bob * 0.4);
  const verde = o.cor || '#6fae6a', verde2 = mix(verde, '#000000', 0.25), barriga = o.barriga || '#e8e0a0';
  // pernas
  for (const sx of [-1, 1]) { c.fillStyle = verde2; rrect(c, 92 * sx - 30, -90, 60, 90, 24); c.fill(); c.fillStyle = barriga; for (let k = -1; k <= 1; k++) { ell(c, 92 * sx + k * 17, -4, 9, 8); c.fill(); } }
  // corpo
  c.fillStyle = lg(c, -140, -240, 140, -60, [[0, mix(verde, '#ffffff', 0.2)], [1, verde2]]); ell(c, 0, -150, 150, 100); c.fill();
  c.fillStyle = barriga; ell(c, 0, -112, 100, 56); c.fill();
  // rabinho
  c.fillStyle = verde2; c.beginPath(); c.moveTo(130, -160); c.quadraticCurveTo(210, -170, 220, -120); c.quadraticCurveTo(170, -130, 130, -110); c.fill();
  // babado (frill)
  const fr = o.babado || '#e8744a';
  c.fillStyle = mix(fr, '#000000', 0.1); c.beginPath(); c.arc(0, -300, 150, Math.PI * 1.02, Math.PI * 1.98); c.lineTo(0, -240); c.closePath(); c.fill();
  c.fillStyle = fr; c.beginPath(); c.arc(0, -300, 132, Math.PI * 1.03, Math.PI * 1.97); c.lineTo(0, -250); c.closePath(); c.fill();
  c.fillStyle = '#f6d878'; for (let i = 0; i < 9; i++) { const a = Math.PI * (1.1 + i * 0.1); ell(c, Math.cos(a) * 150, -300 + Math.sin(a) * 150, 14, 14); c.fill(); }
  c.fillStyle = hex('#ffffff', 0.35); for (let i = 0; i < 5; i++) { const a = Math.PI * (1.18 + i * 0.16); ell(c, Math.cos(a) * 84, -300 + Math.sin(a) * 84, 9, 9); c.fill(); }
  // cabeca
  c.fillStyle = lg(c, -100, -400, 100, -200, [[0, mix(verde, '#ffffff', 0.22)], [1, verde2]]); ell(c, 0, -280, 108, 96); c.fill();
  c.fillStyle = mix(verde, '#ffffff', 0.34); ell(c, 0, -234, 74, 48); c.fill();
  // chifres
  c.fillStyle = '#f6efd6'; for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(60 * sx - 14, -340); c.lineTo(104 * sx, -430); c.lineTo(60 * sx + 14, -330); c.closePath(); c.fill(); }
  c.beginPath(); c.moveTo(-12, -262); c.lineTo(0, -320); c.lineTo(12, -262); c.closePath(); c.fill();
  c.fillStyle = '#d9c88a'; ell(c, 0, -218, 40, 16); c.fill();
  // olhos
  const pisc = (Math.sin(t * 1.1 + 2) > 0.985) ? 0.12 : 1;
  olhos(c, o, 0, -292, 1, pisc, 0);
  c.fillStyle = hex('#e87a6a', 0.4); ell(c, -76, -250, 16, 11); c.fill(); ell(c, 76, -250, 16, 11); c.fill();
  c.fillStyle = '#3a1a10'; ell(c, -12, -246, 4, 6); c.fill(); ell(c, 12, -246, 4, 6); c.fill();
  const ab = falando ? clamp(amp * 1.3, 0.12, 1) : 0;
  if (ab > 0.08) { c.fillStyle = '#4a1410'; ell(c, 0, -206 + ab * 3, 24 - ab * 4, 5 + ab * 20); c.fill(); }
  else { c.strokeStyle = '#4a2a18'; c.lineWidth = 5; c.beginPath(); c.arc(0, -214, 20, 0.3, Math.PI - 0.3); c.stroke(); }
  c.restore();
}

// ---------------------------------------------------------------- elenco e cameras
let cast = {prot: 'explorador', f: ['exploradora', 'guia', 'bebe-tricera'], amb: {}};
window.setElenco = spec => { cast = Object.assign({prot: 'explorador', f: [], amb: {}}, spec || {}); };
let shots = [];
window.setShots = s => { shots = s; };

const scenes = {};      // nome -> {build(hora) -> inst}
const cache = {};
function getInst(amb, hora) {
  const key = amb + '|' + (hora || 'padrao');
  if (!cache[key]) { const S = scenes[amb]; if (!S) throw new Error('cenario 2D inexistente: ' + amb); cache[key] = S.build(hora || 'manha'); }
  return cache[key];
}

// posicao (mundo) das pessoas de cada cenario: {prot:[x,yChao], f:[[x,y],..]} e largura do mundo
function camPara(inst, nome, u, cx0) {
  const C = inst.WW / 2, sl = inst.slots, cab = -430;
  const P = sl.prot, F = sl.f;
  const pos = id => id === 'prot' ? P : F[parseInt(id.slice(1)) % F.length];
  let cx = C, cy = H / 2 + inst.cyBase, z = 1.0;
  const e = ease(u);
  const perto = (p, zz, dx) => { cx = p[0] + (dx || 0); cy = p[1] - 330; z = zz; };
  if (/^f\d$/.test(nome)) { const p = pos(nome); perto(p, lerp(1.7, 1.95, e), lerp(-30, 10, e)); }
  else if (/^f\dc$/.test(nome)) { const p = pos(nome.slice(0, 2)); perto(p, lerp(1.2, 1.38, e), lerp(60, -20, e)); }
  else if (nome === 'eu-frente') perto(P, lerp(1.65, 1.9, e), lerp(20, -20, e));
  else if (nome === 'eu-costas') perto(P, lerp(1.15, 1.3, e), lerp(-180, -90, e));
  else if (nome === 'eu-lado') perto(P, lerp(1.25, 1.1, e), lerp(220, 100, e));
  else if (nome === 'alto') { cx = lerp(C - 160, C + 160, e); cy = H / 2 + inst.cyBase - 360; z = lerp(1.05, 1.0, e); }
  else if (nome === 'panoramica' || nome === 'ampla') { cx = lerp(C - 210, C + 210, e); cy = H / 2 + inst.cyBase; z = nome === 'ampla' ? lerp(1.0, 1.08, e) : 1.0; }
  else { cx = C + lerp(-60, 80, e); cy = H / 2 + inst.cyBase - 40; z = lerp(1.0, 1.28, e); }       // pov*: dolly lento
  // nao deixa a camera sair do mundo
  const lim = (inst.WW - W / z) / 2; cx = clamp(cx, C - lim, C + lim);
  const vy0 = inst.yMin + H / (2 * z), vy1 = inst.yMax - H / (2 * z); cy = clamp(cy, vy0, Math.max(vy0, vy1));
  return {cx, cy, z};
}

function layerDraw(inst, L, cam) {
  const p = L.p, zl = 1 + (cam.z - 1) * (0.25 + 0.75 * p);
  const sx = (cam.cx - inst.WW / 2) * p, sy = (cam.cy - (H / 2 + inst.cyBase)) * p * 0.8;
  const x = W / 2 - (L.c.width / 2 + sx) * zl, y = H / 2 + (L.y - H / 2 - sy) * zl;
  g.drawImage(L.c, x, y, L.c.width * zl, L.c.height * zl);
}

window.frame = function (t, amp, fmt) {
  let s = shots[shots.length - 1];
  for (const x of shots) if (t >= x.t0 && t < x.t1) { s = x; break; }
  const inst = getInst(s.amb, s.hora);
  const u = clamp((t - s.t0) / Math.max(0.05, s.t1 - s.t0), 0, 1);
  const cam = camPara(inst, s.cam || 'ampla', u);
  const sh = 3; cam.cx += Math.sin(t * 1.7) * sh; cam.cy += Math.sin(t * 2.3) * sh;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  // quem aparece em cena
  const lista = (cast.amb && cast.amb[s.amb]) || cast.f || [];
  const elenco = [];
  const vazio = (cast.vazio || []).indexOf(s.amb) >= 0;
  const protRole = (cast.protAmb && cast.protAmb[s.amb]) || cast.prot;
  if (!vazio) {
    elenco.push({id: 'prot', role: protRole, pos: inst.slots.prot});
    inst.slots.f.forEach((p, i) => { if (lista.length && i < lista.length) elenco.push({id: 'f' + i, role: lista[i], pos: p}); });
  }
  inst.draw(g, t, cam, {
    layer: L => layerDraw(inst, L, cam),
    personagens: () => {
      const falante = s.falante || '';
      const ord = elenco.slice().sort((a, b) => a.pos[1] - b.pos[1]);
      for (const e of ord) {
        const o = papel2d(e.role); o.fase = e.id.length * 1.7 + e.id.charCodeAt(e.id.length - 1);
        const sx = W / 2 + (e.pos[0] - cam.cx) * cam.z, sy = H / 2 + (e.pos[1] - cam.cy) * cam.z;
        const fala = falante === e.id || (e.id === 'prot' && falante === 'prot');
        const eP = (elenco.find(q => q.id === 'prot') || {pos: inst.slots.prot}).pos[0];
        const olha = e.id === 'prot' ? -0.4 : (e.pos[0] < eP ? 0.8 : -0.8);
        const esc = (o.escala || 1) * cam.z * (e.pos[2] || 1);
        (o.tipo === 'tricera' ? tricera : humano)(g, o, sx, sy, esc, t, fala, amp, olha);
      }
    },
    cam, t, amp, shot: s, u});
  // tempero final: vinheta suave
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.42)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  return fmt === 'png' ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.93);
};
window.ambientes = () => Object.fromEntries(Object.keys(scenes).map(k => [k, ['ampla']]));
